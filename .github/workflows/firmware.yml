# Compila el firmware y publica el instalador web en GitHub Pages.
# - En cada push a main: compila y despliega la página.
# - En pull requests: solo compila.
# Requisito (una vez): Settings -> Pages -> Source = "GitHub Actions".
name: Firmware y página de instalación

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          idf.py merge-bin   # bootloader + particiones + app en un solo .bin (offset 0)

      - name: Preparar la web
        shell: bash
        run: |
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          mkdir -p site/firmware
          cp -r web/. site/
          cp build/merged-binary.bin site/firmware/firmware.bin
          sed -e "s/__VERSION__/${VERSION}/g" web/manifest.json > site/manifest.json
          sed -i -e "s/__VERSION__/${VERSION}/g" -e "s#__REPO__#${GITHUB_REPOSITORY}#g" site/index.html
          ls -lR site

      - name: Guardar binarios
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/merged-binary.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/*.bin
            build/flash_args

      - name: Subir la web
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
