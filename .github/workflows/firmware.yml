# Pushes to main build the firmware and deploy the installer; pull requests only build.
# In Settings -> Pages, set Source to "GitHub Actions".
name: Firmware and web installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1.1
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
          idf.py merge-bin   # Bootloader, partition table, and app at offset 0.

      - name: Package the web installer
        shell: bash
        run: |
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          mkdir -p site/firmware
          cp -r web/. site/
          cp build/merged-binary.bin site/firmware/firmware.bin
          sed -e "s/__VERSION__/${VERSION}/g" web/manifest.json > site/manifest.json
          sed -i -e "s/__VERSION__/${VERSION}/g" -e "s#__REPO__#${GITHUB_REPOSITORY}#g" site/index.html
          ls -lR site

      - name: Upload firmware binaries
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/merged-binary.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/*.bin
            build/flash_args

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
